[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyamit-backend"
version = "0.1.0"
description = "Vyamit API, realtime LiveKit agent, and Supabase domain services"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "google-cloud-aiplatform>=1.85,<2",
    "google-genai>=1.0,<3",
    "httpx>=0.28,<1",
    "livekit-agents>=1.6,<2",
    "livekit-api>=1.2,<2",
    "livekit-plugins-ai-coustics>=0.3,<1",
    "livekit-plugins-cartesia>=1.6,<2",
    "livekit-plugins-google>=1.6,<2",
    "livekit-plugins-mistralai>=1.6,<2",
    "pydantic-settings>=2.7,<3",
    "pydantic>=2.10,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "python-jose[cryptography]>=3.3,<4",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the configured Supabase project and is never run by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
